site_description: DevOps tips and useful knowledge
site_name: Karlipe Gomes
site_url: https://karlipegomes.github.io
nav:
  - Home: index.md
  - Blog:
    - blog/index.md
    - Séries: series.md
    - Tags: tags.md
  # - HomeLab:
  #   - Environment:
  #     - Module-ESC-Cluster: distroless/bdc-images/custom-packages.md
  #   - Helm-Charts:
  #     - Module: distroless/bdc-images/custom-packages.md
  # - Projects:
  #   - ScoreCardAPI:
  #     - CreatingMetrics': projects/scorecard/metrics.md
  #   - Module-ESC-Cluster:
  #     - Melange: distroless/bdc-images/custom-packages.md
  #   - Module-ESC-Service:
  #     - Melange: distroless/bdc-images/custom-packages.md
  - About:
    - about/index.md

theme:
  name: material
  custom_dir: overrides
  # fontes auto-hospedadas em docs/assets/ — nenhuma requisição ao Google
  font: false
  logo: layouts/logo.png
  favicon: layouts/favicon.png
  features:
    - content.code.annotate
    - content.code.annotation
    - content.code.copy
    - content.tabs.link
    # - navigation.expand
    - navigation.indexes
    - navigation.instant
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - content.tooltips
    - search.highlight
    - search.suggest
    - search.share
    - toc.follow
  language: en
  palette:
    # Paleta ativa por padrão (escura); o toggle leva para a clara.
    - scheme: slate
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to light mode
      primary: custom
      accent: custom
    - scheme: default
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
      primary: custom
      accent: custom

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.tasklist:
      custom_checkbox: true
  # - pymdownx.blocks.caption
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

hooks:
  - hooks/blog_data.py

plugins:
  - drawio
  - glightbox
  - search
  - tags
  - blog:
      authors: true
      authors_file: "{blog}/.authors.yml"
      archive_date_format: MMMM yyyy
      blog_dir: blog
      blog_toc: true
      categories: true
      draft_if_future_date: true
      post_date_format: long
      post_dir: "{blog}/posts"
      post_slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
          # Remove acentos do slug: "próprios" -> "proprios"
          normalize: NFKD
      post_slugify_separator: _
      post_url_format: "{date}/{slug}"
      post_readtime: true
      post_readtime_words_per_minute: 200
  - meta:
      meta_file: .meta.yml
  - rss:
      abstract_delimiter: <!-- more -->
      feeds_filenames:
        json_created: feed.json
        json_updated: feed.json
        rss_created: atom.xml
        rss_updated: rss.xml
      date_from_meta:
        as_creation: date.created
        as_update: date.updated
      match_path: "blog/posts/.*"
      use_material_blog: true
      image: https://github.com/Guts/mkdocs-rss-plugin/blob/main/docs/assets/logo_rss_plugin_mkdocs.png?raw=true

extra:
  analytics:
    provider: google
    property: G-S8Z38MG7BX
  consent:
