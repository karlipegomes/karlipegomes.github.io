    description: >-
      This site uses Google Analytics to understand which content is useful,
      and Disqus to power the comments. Neither is loaded until you choose.
      You can change your decision at any time.
    cookies:
      analytics:
        name: Google Analytics
        checked: false
      disqus:
        name: Disqus (comments)
        checked: false
    actions:
      - accept
      - manage
      - reject
